name: HITL isolated tests

on:
  pull_request:
    paths:
      - "crop_correction_store.py"
      - "crop_legacy_adapter.py"
      - "hitl_review_app.py"
      - "hitl_export_dataset.py"
      - "hitl_crop_feedback.py"
      - "hitl_hf_adapter.py"
      - "tests/test_crop_correction_store.py"
      - "tests/test_crop_legacy_adapter.py"
      - "tests/test_hitl_review_app.py"
      - "tests/test_hitl_export_dataset.py"
      - "tests/test_hitl_crop_feedback.py"
      - "tests/test_hitl_hf_adapter.py"
      - ".github/workflows/hitl-tests.yml"
  push:
    branches:
      - "feat/hitl-batch2-stability-stage5"
    paths:
      - "crop_correction_store.py"
      - "crop_legacy_adapter.py"
      - "hitl_review_app.py"
      - "hitl_export_dataset.py"
      - "hitl_crop_feedback.py"
      - "hitl_hf_adapter.py"
      - "tests/test_crop_correction_store.py"
      - "tests/test_crop_legacy_adapter.py"
      - "tests/test_hitl_review_app.py"
      - "tests/test_hitl_export_dataset.py"
      - "tests/test_hitl_crop_feedback.py"
      - "tests/test_hitl_hf_adapter.py"
      - ".github/workflows/hitl-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UI runtime for smoke test
        run: |
          python -m pip install "gradio>=4.44,<6" "datasets>=2.20"
      - name: Compile HITL modules
        run: |
          python -m py_compile crop_correction_store.py crop_legacy_adapter.py hitl_review_app.py hitl_export_dataset.py hitl_crop_feedback.py hitl_hf_adapter.py
      - name: Run isolated HITL unit tests
        run: |
          python -m unittest discover -s tests -p "test_crop_correction_store.py" -v
          python -m unittest discover -s tests -p "test_crop_legacy_adapter.py" -v
          python -m unittest discover -s tests -p "test_hitl_review_app.py" -v
          python -m unittest discover -s tests -p "test_hitl_export_dataset.py" -v
          python -m unittest discover -s tests -p "test_hitl_crop_feedback.py" -v
          python -m unittest discover -s tests -p "test_hitl_hf_adapter.py" -v
